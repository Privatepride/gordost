name: Deploy to server

on:
  push:
    branches: ["main", "master"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /opt/gordost

            git fetch origin
            git checkout main
            git reset --hard origin/main

            export NODE_OPTIONS="--max-old-space-size=4096"
            export npm_config_jobs="2"
            export npm_config_foreground_scripts="true"

            if command -v free >/dev/null 2>&1; then
              if ! swapon --show 2>/dev/null | grep -q .; then
                if command -v fallocate >/dev/null 2>&1; then
                  fallocate -l 4G /swapfile || true
                else
                  dd if=/dev/zero of=/swapfile bs=1M count=4096 status=none || true
                fi
                chmod 600 /swapfile || true
                mkswap /swapfile >/dev/null 2>&1 || true
                swapon /swapfile || true
              fi
              free -h || true
            fi

            rm -rf node_modules
            PATH=/usr/bin:$PATH npm ci --no-audit --no-fund --include=optional

            if ! node -e "require('@rollup/rollup-linux-x64-gnu')" >/dev/null 2>&1; then
              ROLLUP_VER="$(node -p "require('./node_modules/rollup/package.json').version")"
              PATH=/usr/bin:$PATH npm install --no-audit --no-fund --no-save "@rollup/rollup-linux-x64-gnu@${ROLLUP_VER}"
            fi

            node -e "require('@rollup/rollup-linux-x64-gnu'); console.log('rollup native ok')"
            PATH=/usr/bin:$PATH npm rebuild rollup || true
            PATH=/usr/bin:$PATH npm run build

            printf '%s\n' 'export { createServerEntry, default } from "./index.js";' > dist/server/server.js

            docker restart gordost-app
            docker restart gordost-web
