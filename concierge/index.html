<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a1510" />
    <title>Гордость — консьерж</title>
    <!--
      Официально: https://core.telegram.org/bots/webapps#initializing-mini-apps
      «place the script telegram-web-app.js in the <head> tag before any other scripts»
    -->
    <!-- Локальная копия SDK: тот же файл с telegram.org, но с вашего домена (иногда WebView режет внешние скрипты). -->
    <script src="/tg-web-app.js"></script>
    <script>
      try {
        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.ready();
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <p
        style="
          margin: 0;
          padding: 24px 16px;
          font: 16px/1.45 system-ui, sans-serif;
          color: #9a8f7d;
          text-align: center;
        "
      >
        Загрузка…
      </p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
